<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    :root{--azul:#002b7f;--oro:#d59f0f;--fondo:#eef3f9;--texto:#172033;
      --gris:#667085;--borde:#d8e1ec;--verde:#176a37;--verdebg:#e8f6ed;
      --ambar:#8a5b00;--ambarbg:#fff7df;--rojo:#8b1e1e;--rojobg:#fff0f0}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#f8fbff,var(--fondo));
      color:var(--texto);font-family:Arial,sans-serif}header{padding:18px 22px;color:#fff;
      background:linear-gradient(135deg,var(--azul),#0a58b5);border-bottom:5px solid var(--oro)}
    .cabecera{max-width:980px;margin:auto;display:flex;justify-content:space-between;gap:18px;align-items:center}
    h1{margin:0}.sub{margin:4px 0 0;font-size:12px;opacity:.85}.estado{padding:7px 11px;
      background:rgba(255,255,255,.14);border-radius:999px;font-size:12px;font-weight:700}
    main{max-width:980px;margin:auto;padding:24px;display:grid;grid-template-columns:1fr .9fr;gap:20px}
    .panel{background:#fff;border:1px solid var(--borde);border-radius:18px;box-shadow:0 14px 36px rgba(0,43,127,.08)}
    .captura,.resultado{padding:24px}.modos{display:flex;gap:8px;margin-bottom:18px}.modos button{flex:1;
      padding:11px;border:1px solid var(--borde);border-radius:10px;background:#f8fafc;font-weight:700}
    .modos .activo{background:var(--azul);color:#fff}label{display:block;margin-bottom:7px;color:var(--gris);
      font-size:12px;font-weight:700}#codigo{width:100%;padding:17px;border:2px solid var(--borde);
      border-radius:12px;font:18px 'Courier New'}#codigo:focus{outline:none;border-color:#0a58b5;
      box-shadow:0 0 0 4px rgba(10,88,181,.12)}.ayuda{color:var(--gris);font-size:12px;line-height:1.45}
    .acciones{display:flex;gap:10px;margin-top:17px}.boton{flex:1;padding:12px;border:0;border-radius:10px;font-weight:800}
    .primario{background:var(--azul);color:#fff}.secundario{background:#edf4ff;color:var(--azul)}
    #zonaCamara{display:none;margin-top:18px}#lectorCamara{overflow:hidden;border:1px solid var(--borde);border-radius:12px}
    .resultado.espera{display:grid;place-items:center;text-align:center;color:var(--gris);min-height:410px}
    .resultado.exito{background:var(--verdebg)}.resultado.advertencia{background:var(--ambarbg)}
    .resultado.error{background:var(--rojobg)}.icono{font-size:54px}.mensaje{font-size:22px;font-weight:800}
    .persona{font-size:20px}.evento{color:var(--azul);font-weight:700}.detalle{margin-top:18px;padding:14px;
      background:rgba(255,255,255,.7);border-radius:12px;font-size:13px;line-height:1.65}
    .procesando{opacity:.65;pointer-events:none}@media(max-width:760px){main{grid-template-columns:1fr;padding:14px}
      .cabecera{align-items:flex-start;flex-direction:column}}
  </style>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
<header><div class="cabecera"><div><h1>SIGEA CHECK-IN</h1><p class="sub">Registro profesional de asistencia</p></div>
<div class="estado">LISTO PARA ESCANEAR</div></div></header>
<main>
<section class="panel captura" id="panelCaptura">
  <h2>Lectura del pase</h2>
  <div class="modos">
    <button id="btnLector" class="activo" onclick="cambiarModo('LECTOR_USB')">Lector USB</button>
    <button id="btnCamara" onclick="cambiarModo('CAMARA_WEB')">Cámara</button>
  </div>
  <div id="zonaLector">
    <label for="codigo">Código leído</label>
    <input id="codigo" autocomplete="off" placeholder="Escanee el Pase Digital">
    <p class="ayuda">El Zebra escribirá el código y enviará Enter. Para probar, escriba el QR y pulse Enter.</p>
    <div class="acciones">
      <button class="boton primario" onclick="procesarCampo()">Procesar</button>
      <button class="boton secundario" onclick="limpiar()">Limpiar</button>
    </div>
  </div>
  <div id="zonaCamara"><div id="lectorCamara"></div>
    <p class="ayuda">Autorice la cámara y apunte al Pase Digital.</p></div>
</section>
<section class="panel resultado espera" id="resultado">
  <div><div class="icono">▣</div><h2>Esperando lectura</h2><p>Presente el Pase Digital frente al lector.</p></div>
</section>
</main>
<script>
const CFG=<?!= JSON.stringify(configuracion) ?>;
let modo='LECTOR_USB', camara=null, procesando=false, ultimo='', momento=0;
const campo=document.getElementById('codigo');
campo.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();procesarCampo();}});
function checkin_ProcesarParametrosUrl_(){
  if(!google || !google.script || !google.script.url) return;

  google.script.url.getLocation(function(location){
    location = location || {};
    const p = location.parameter || {};
    const codigo = String(p.codigo || '').trim();
    const origen = String(p.origen || '').trim().toUpperCase();

    if(!codigo) return;

    campo.value = codigo;

    procesar(
      codigo,
      origen === 'CAMARA_MOVIL'
        ? 'CAMARA_MOVIL'
        : 'LECTOR_USB'
    );
  });
}

window.addEventListener('load',()=>{
  campo.focus();
  setTimeout(checkin_ProcesarParametrosUrl_,250);
});

function cambiarModo(m){
  modo=m; const lector=m==='LECTOR_USB';
  document.getElementById('zonaLector').style.display=lector?'block':'none';
  document.getElementById('zonaCamara').style.display=lector?'none':'block';
  document.getElementById('btnLector').classList.toggle('activo',lector);
  document.getElementById('btnCamara').classList.toggle('activo',!lector);
  if(lector){detenerCamara();setTimeout(()=>campo.focus(),80);}else iniciarCamara();
}
function procesarCampo(){const c=String(campo.value||'').trim();if(!c){mostrar({tipo:'ERROR',mensaje:'No se recibió ningún código.'});return;}procesar(c,'LECTOR_USB');}
function procesar(c,origen){
  if(procesando)return; const ahora=Date.now(); if(c===ultimo&&ahora-momento<2500)return;
  ultimo=c;momento=ahora;procesando=true;document.getElementById('panelCaptura').classList.add('procesando');
  google.script.run.withSuccessHandler(r=>{procesando=false;document.getElementById('panelCaptura').classList.remove('procesando');
    mostrar(r);limpiar();if(modo==='CAMARA_WEB')setTimeout(iniciarCamara,1200);})
  .withFailureHandler(e=>{procesando=false;document.getElementById('panelCaptura').classList.remove('procesando');
    mostrar({tipo:'ERROR',mensaje:e&&e.message?e.message:'Error de comunicación.'});limpiar();})
  .checkin_ProcesarCodigo(c,{origen:origen,idEvento:CFG.idEvento||'',dispositivo:navigator.userAgent,
    observaciones:'Registro desde SIGEA Check-In'});
}
function mostrar(r){
  r=r||{};const p=document.getElementById('resultado');const t=String(r.tipo||'ERROR').toLowerCase();
  p.className='panel resultado '+t;const icon=t==='exito'?'✓':t==='advertencia'?'!':'×';
  const per=r.participante||{},ev=r.evento||{};
  p.innerHTML=`<div><div class="icono">${icon}</div><p class="mensaje">${esc(r.mensaje||'Resultado procesado')}</p>
  <h3 class="persona">${esc(per.nombre||'')}</h3><p class="evento">${esc(ev.nombre||'')}</p>
  <div class="detalle"><b>Movimiento:</b> ${esc(r.tipoMovimiento||'—')}<br><b>Modalidad:</b> ${esc(r.modalidad||'—')}
  <br><b>Hora:</b> ${esc(r.fechaHora||'—')}<br><b>Código:</b> ${esc(r.codigo||'—')}</div></div>`;
}
function limpiar(){campo.value='';if(modo==='LECTOR_USB')setTimeout(()=>campo.focus(),80);}
function iniciarCamara(){
  if(typeof Html5Qrcode==='undefined'){mostrar({tipo:'ERROR',mensaje:'No se pudo cargar el lector de cámara.'});return;}
  detenerCamara();camara=new Html5Qrcode('lectorCamara');
  camara.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},
    texto=>{detenerCamara();procesar(texto,'CAMARA_WEB');},()=>{})
    .catch(e=>mostrar({tipo:'ERROR',mensaje:'No fue posible iniciar la cámara: '+e}));
}
function detenerCamara(){if(camara){camara.stop().catch(()=>{}).finally(()=>camara=null);}}
function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
</script>
</body>
</html>
